<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectsTracker</title>
    <meta
      name="description"
      content="A visual time tracker: one-click timers per project, a calendar that fills as you work, and a year-long activity heatmap. Try the live demo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#f2ead4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131a16" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("pt-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
