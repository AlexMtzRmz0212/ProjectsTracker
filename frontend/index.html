<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ProjectsTracker</title>
    <meta
      name="description"
      content="A visual time tracker: one-click timers per project, a calendar that fills as you work, and a year-long activity heatmap. Try the live demo."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Tracker" />
    <!-- Follows the app's own theme (useTheme.js), so an installed window's title bar matches it -->
    <meta name="theme-color" content="#131a16" />
    <script>
      // Apply the saved/system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("pt-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
      } catch (e) {
        t = "dark";
      }
      document.documentElement.dataset.theme = t;
      document.querySelector('meta[name="theme-color"]').content = t === "light" ? "#f2ead4" : "#131a16";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
